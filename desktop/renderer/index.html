<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src http: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Code Remote</title>
    <link rel="stylesheet" href="./shell.css" />
    <script src="./shell.js" defer></script>
  </head>
  <body>
    <div class="desktop-shell">
      <aside class="device-sidebar" aria-label="设备连接" data-l10n-aria="connections">
        <header class="sidebar-header">
          <div class="brand">
            <img src="./code-remote.svg" alt="" />
            <div><strong>Code Remote</strong><small data-l10n="desktopSubtitle">多设备连接</small></div>
          </div>
          <button id="add-device" class="icon-button" type="button" aria-label="添加设备" title="添加设备" data-l10n-aria="addDevice" data-l10n-title="addDevice">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
          </button>
        </header>

        <div class="connection-heading"><span data-l10n="myDevices">我的设备</span><span id="device-count" class="device-count">0</span></div>
        <nav id="device-list" class="device-list" aria-label="已保存设备"></nav>
        <footer class="sidebar-footer">
          <span class="status-mark" aria-hidden="true"></span>
          <span id="storage-note" data-l10n="localStorageNote">连接信息加密保存在本机</span>
          <button id="language-toggle" class="language-toggle" type="button" aria-label="切换界面语言" title="切换界面语言" data-l10n-aria="toggleLanguage" data-l10n-title="toggleLanguage">EN</button>
        </footer>
      </aside>

      <main class="empty-stage">
        <iframe id="remote-frame" class="remote-frame" title="远端 Code Remote 页面" allow="clipboard-read; clipboard-write; microphone; camera" referrerpolicy="strict-origin" hidden></iframe>
        <div id="empty-state" class="empty-state">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="22" rx="5" /><path d="M10 13h12M10 19h7" /></svg>
          </div>
          <h1 data-l10n="emptyTitle">连接一台 Code Remote 设备</h1>
          <p data-l10n="emptyDescription">添加电脑地址和匹配码，即可在这里继续查看它的聊天、文件与终端。</p>
          <button id="empty-add-device" class="primary-button" type="button" data-l10n="addDevice">添加设备</button>
        </div>
      </main>
    </div>

    <dialog id="device-dialog" class="device-dialog" aria-labelledby="dialog-title">
      <form id="device-form" novalidate>
        <div class="dialog-heading">
          <div>
            <span class="dialog-eyebrow" data-l10n="newConnection">新连接</span>
            <h2 id="dialog-title" data-l10n="addDevice">添加设备</h2>
          </div>
          <button id="close-dialog" class="icon-button icon-button--quiet" type="button" aria-label="关闭" data-l10n-aria="close">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
          </button>
        </div>

        <label class="form-field">
          <span><span data-l10n="deviceName">设备名称</span> <small data-l10n="optional">选填</small></span>
          <input id="device-name" name="name" type="text" maxlength="48" placeholder="例如：家里的电脑" data-l10n-placeholder="namePlaceholder" autocomplete="off" />
        </label>
        <label class="form-field">
          <span data-l10n="webAddress">Code Remote 网页地址</span>
          <input id="device-endpoint" name="endpoint" type="url" placeholder="http://192.168.1.10:4173" data-l10n-placeholder="addressPlaceholder" autocomplete="url" required />
          <small data-l10n="addressHelp">填写运行这台设备上 Code Remote 的电脑地址。</small>
        </label>
        <label id="pairing-code-field" class="form-field">
          <span data-l10n="pairingCode">连接匹配码</span>
          <input id="pairing-code" name="code" type="text" inputmode="text" maxlength="12" placeholder="输入电脑终端显示的 8 位匹配码" data-l10n-placeholder="codePlaceholder" autocomplete="one-time-code" required />
        </label>
        <p id="browser-pair-note" class="pairing-note" hidden data-l10n="browserPairNote">添加后，页面会打开目标电脑的配对界面，请在那里输入匹配码。</p>

        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="cancel-dialog" class="secondary-button" type="button" data-l10n="cancel">取消</button>
          <button id="pair-device" class="primary-button" type="submit" data-l10n="pairAdd">配对并添加</button>
        </div>
        <p id="privacy-note" class="privacy-note" data-l10n="privacyNote">匹配码只用于配对。配对凭据会加密保存在本机，不会放进网页地址。</p>
      </form>
    </dialog>

    <div id="device-menu" class="device-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-action="open-window" data-l10n="openWindow">在新窗口打开</button>
      <button type="button" role="menuitem" data-action="rename" data-l10n="rename">重命名</button>
      <div class="menu-separator" role="separator"></div>
      <button class="danger-action" type="button" role="menuitem" data-action="remove" data-l10n="removeDevice">移除设备</button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
